services:
  today-bot:
    build:
      context: .
    container_name: today-bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TODOIST_API_TOKEN: ${TODOIST_API_TOKEN:-}
      ADMIN_USER_ID: ${ADMIN_USER_ID:-}
    volumes:
      - today-bot-data:/app/app/data

volumes:
  today-bot-data:
